# ==============================================================================
# The tpl repo of a cookiecutter template. It is not a Python package: this
# file only pins the template's own version and the dependencies of the
# maintenance scripts in .mise/tasks/.
#
# Spec: .claude/skills/cctpl-base-cn/references/08-versioning-and-release.md
# ==============================================================================
[project]
name = "cookiecutter_pywf_open_source"
# The tpl version. This is its only source: `mise run sync` writes it into
# cookiecutter.json (_template_version) and README.rst. Re-run sync after a bump.
version = "2.1.0"
description = "Cookiecutter template for Python open source library projects"
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
maintainers = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
readme = "README.rst"
requires-python = ">=3.11,<4.0"

# Direct imports of .mise/tasks/
dependencies = [
    "cookiecutter>=2.6.0,<3.0.0",
    "cookiecutter_maker>=1.1.0,<2.0.0",
    "pygithub_mate>=0.1.1,<1.0.0",
    "jinja2>=3.1.0,<4.0.0", # renders README.rst
    "pathspec>=0.12.0,<2.0.0", # matches EXCLUDE in check-roundtrip
]

[project.urls]
Homepage = "https://github.com/MacHu-GWU/cookiecutter-pywf_open_source"
Repository = "https://github.com/MacHu-GWU/cookiecutter-pywf_open_source"
Issues = "https://github.com/MacHu-GWU/cookiecutter-pywf_open_source/issues"
Changelog = "https://github.com/MacHu-GWU/cookiecutter-pywf_open_source/blob/main/release-history.rst"

[tool.uv]
# Only a virtual environment for the scripts; never build or install this repo.
package = false
